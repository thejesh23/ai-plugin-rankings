name: Weekly discovery

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
    inputs:
      disabled_sources:
        description: "Comma-separated source names to skip (e.g. claude_marketplaces)"
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e .

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run discovery
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISABLED_SOURCES: ${{ inputs.disabled_sources }}
        run: python -m scripts.discover

      - name: Commit additions
        run: |
          git add plugins.yaml discovery.log
          if git diff --cached --quiet; then
            echo "No new plugins this run."
          else
            # numstat output: "<added> <removed> <path>" per file. discovery.log
            # is append-only, so <added> is the count of new entries.
            COUNT=$(git diff --cached --numstat -- discovery.log | awk '{print $1+0}')
            [ -z "$COUNT" ] && COUNT=0
            git commit -m "Auto-add ${COUNT} plugins from discovery ($(date -u +%Y-%m-%d))"
            git push origin main
          fi

      - name: Checkout data branch (for re-render)
        if: success()
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Re-render rankings with new entries
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_DIR: ${{ github.workspace }}
          DATA_DIR: ${{ github.workspace }}/data-branch
        run: python -m scripts.scrape

      - name: Commit & push rendered output
        if: success()
        run: |
          git add README.md rankings/ data/latest.json
          if git diff --cached --quiet; then
            echo "No render diff."
          else
            git commit -m "Re-render after discovery ($(date -u +%Y-%m-%d))"
            git push origin main
          fi
          cd data-branch
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot diff."
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%d) (post-discovery)"
            git push origin data
          fi

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly discovery failed: ${today}`,
              body: `See: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['cron-failure'],
            });
